name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: medialane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/medialane_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test src
      - name: Real-database tests
        run: |
          bunx prisma db push --skip-generate
          RUN_STORE_TEST_DATABASE_URL="$DATABASE_URL" bun test src/launchpad/run-store.sql.test.ts
          FUNDING_STORE_TEST_DATABASE_URL="$DATABASE_URL" bun test src/funding/store.sql.test.ts
